name: keep-alive

# Ping backend định kỳ để Vercel serverless không cold-start / sleep khi idle.
# Chạy mỗi 5 phút + cho phép trigger tay từ tab Actions.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/ping (giữ ấm instance)
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/ping.json -w "%{http_code}" --max-time 60 "https://gialai-backend-fresh.vercel.app/api/ping" || echo "000")
            echo "attempt $i -> HTTP $CODE $(cat /tmp/ping.json 2>/dev/null)"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "ping failed after 3 attempts"
          exit 1
